[package]
name = "windows-token"
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
description = "RAII wrappers over Win32 process/thread tokens: OpenProcessToken, DuplicateTokenEx, ImpersonateLoggedOnUser, AdjustTokenPrivileges. Drop = RevertToSelf. Built on win32-min (hand-rolled FFI, no windows-rs)."
repository = "https://github.com/icedracon/windows-token"
homepage = "https://github.com/icedracon/windows-token"
documentation = "https://docs.rs/windows-token"
readme = "README.md"
keywords = ["windows", "token", "impersonation", "privilege", "raii"]
categories = ["os::windows-apis", "authentication", "api-bindings"]

[target.'cfg(windows)'.dependencies]
win32-min = { version = "0.1", features = ["security-token"] }
thiserror = "2"

[lib]
name = "windows_token"
path = "src/lib.rs"
